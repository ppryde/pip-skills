[tool.pytest.ini_options]
testpaths = ["../../tests/overseer"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
pythonpath = [".", "../../tests/overseer"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true
warn_unused_ignores = true
ignore_missing_imports = true
